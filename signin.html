<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signup - City Hospital</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="auth">
  <h2>Signup</h2>
  <form id="signupForm">
    <input type="text" id="signupUsername" placeholder="Username">
    <input type="password" id="signupPassword" placeholder="Password (min 5 chars)">
    <button type="submit">Signup</button>
    <p id="signupMsg"></p>
  </form>
  <p>Already have an account? <a href="login.html">Login here</a></p>
</section>

<script src="script.js"></script>
</body>
</html>
