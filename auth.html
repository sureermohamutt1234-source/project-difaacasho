<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hospital Auth</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="auth-container">

  <!-- SIGNUP -->
  <form id="signupForm">
    <h2>Signup</h2>
    <input type="text" id="suUser" placeholder="Username">
    <input type="password" id="suPass" placeholder="Password">
    <button type="submit">Signup</button>
    <p id="suMsg"></p>
  </form>

  <!-- LOGIN -->
  <form id="loginForm">
    <h2>Login</h2>
    <input type="text" id="liUser" placeholder="Username">
    <input type="password" id="liPass" placeholder="Password">
    <button type="submit">Login</button>
    <p id="liMsg"></p>
  </form>

</section>

<script src="script.js"></script>
</body>
</html>
